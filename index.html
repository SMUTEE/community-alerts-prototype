<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#09090A">
<meta name="description" content="A clickable hi-fi prototype of Community Alerts — a location-aware community alerting app — across 13 screens, with the experience audit attached to each one.">
<meta property="og:type" content="website">
<meta property="og:title" content="Community Alerts — hi-fi prototype">
<meta property="og:description" content="A clickable hi-fi prototype of Community Alerts — a location-aware community alerting app — across 13 screens, with the experience audit attached to each one.">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%2309090A'/%3E%3Cpath d='M16 7.5C12.4 7.5 9.5 10.4 9.5 14c0 4.6 6.5 10.5 6.5 10.5S22.5 18.6 22.5 14c0-3.6-2.9-6.5-6.5-6.5z' fill='none' stroke='%23FAFAFA' stroke-width='2'/%3E%3Ccircle cx='16' cy='13.8' r='2.2' fill='%23FF5F52'/%3E%3C/svg%3E">
<style>
  html,body{height:100%}
  :root{color-scheme:light;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
  body{margin:0}
  img{max-width:100%}
  [hidden]{display:none!important}
</style>
<title>Community Alerts</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap">
<style>
@font-face{font-family:Satoshi;src:url('satoshi.woff2') format('woff2');font-weight:300 900;font-style:normal;font-display:swap}

/* Layout: quiet studio bench — index, device, and the audit note for the open screen; one column under 940px. */
:root{
  --pg:#E9EAEA; --pg-2:#F6F7F7; --card:#FFFFFF; --ink:#131415; --ink-2:#5C6164;
  --ink-3:#8D9295; --line:#D3D6D7; --accent:#12494F; --shadow:0 28px 64px -20px rgba(9,17,20,.42);
  --f:"Satoshi",-apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,Arial,sans-serif;
  --f-u:"Inter",-apple-system,BlinkMacSystemFont,Helvetica,Arial,sans-serif;

  /* App — fixed in both themes: this is the product */
  --bg:#09090A; --surf:#131315; --surf-2:#1A1A1D; --raise:#202024;
  --fg:#FAFAFA; --fg-2:#A2A3A7; --fg-3:#6C6D72; --hair:#1E1E21; --hair-2:#2A2A2E;
  --crit:#FF5F52; --imp:#E9A13B; --info:#6BA8D8; --ok:#4FC48A;
  --crit-d:#2A1513; --imp-d:#241C10; --info-d:#131E27; --ok-d:#10231A;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --pg:#0C0C0D; --pg-2:#151517; --card:#1A1A1C; --ink:#F0F0F1; --ink-2:#A0A2A5;
  --ink-3:#77797D; --line:#2A2A2D; --accent:#68BAC2; --shadow:0 28px 64px -20px rgba(0,0,0,.8);
  color-scheme:dark;
}}
:root[data-theme="dark"]{
  --pg:#0C0C0D; --pg-2:#151517; --card:#1A1A1C; --ink:#F0F0F1; --ink-2:#A0A2A5;
  --ink-3:#77797D; --line:#2A2A2D; --accent:#68BAC2; --shadow:0 28px 64px -20px rgba(0,0,0,.8);
  color-scheme:dark;
}
*{box-sizing:border-box}
body{margin:0;background:var(--pg);color:var(--ink);font-family:var(--f);-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:3px;border-radius:5px}
.u{font-family:var(--f-u);font-feature-settings:"tnum" 1}

/* ---------- bench ---------- */
.wrap{max-width:1280px;margin:0 auto;padding-inline:22px;padding-block:34px 58px}
.head{display:flex;flex-wrap:wrap;gap:16px 28px;align-items:flex-end;justify-content:space-between;border-bottom:1px solid var(--line);padding-bottom:20px}
.eyebrow{font-family:var(--f-u);font-size:10.5px;font-weight:500;letter-spacing:.14em;text-transform:uppercase;color:var(--ink-3);margin:0 0 8px}
h1{font-size:clamp(30px,4.6vw,42px);font-weight:700;line-height:1;letter-spacing:-.035em;margin:0}
.lede{margin:11px 0 0;max-width:62ch;font-size:14.5px;line-height:1.6;color:var(--ink-2)}
.tag{font-family:var(--f-u);font-size:10.5px;font-weight:500;letter-spacing:.06em;text-transform:uppercase;color:var(--ink-2);border:1px solid var(--line);border-radius:999px;padding:6px 12px;white-space:nowrap}

.bench{display:grid;grid-template-columns:186px minmax(0,390px) minmax(0,1fr);gap:32px;align-items:start;margin-top:30px}
@media (max-width:1040px){.bench{grid-template-columns:166px minmax(0,390px) minmax(0,1fr);gap:22px}}
@media (max-width:940px){.bench{grid-template-columns:minmax(0,1fr);justify-items:center;gap:28px}.nav-col,.notes-col{width:100%;max-width:520px}}

.nav-col{position:sticky;top:calc(env(safe-area-inset-top,0px) + 18px)}
@media (max-width:940px){.nav-col{position:static}}
.nav-g{margin-bottom:20px}
.nav-h{font-family:var(--f-u);font-size:9.5px;font-weight:600;letter-spacing:.14em;text-transform:uppercase;color:var(--ink-3);margin:0 0 9px;padding-left:2px}
.nav-l{display:flex;flex-direction:column;gap:1px}
@media (max-width:940px){.nav-l{flex-direction:row;flex-wrap:wrap;gap:6px}}
.nav-b{display:flex;align-items:center;gap:10px;text-align:left;padding:7px 10px;border-radius:8px;font-size:13.5px;font-weight:500;color:var(--ink-2);line-height:1.3;transition:background .12s,color .12s}
.nav-b .n{font-family:var(--f-u);font-size:10px;font-weight:500;color:var(--ink-3);flex-shrink:0}
.nav-b:hover{background:var(--pg-2);color:var(--ink)}
.nav-b[aria-current="true"]{background:var(--ink);color:var(--pg)}
.nav-b[aria-current="true"] .n{color:var(--pg);opacity:.55}

.dev{display:flex;flex-direction:column;align-items:center;gap:15px}
.phone{width:390px;max-width:100%;aspect-ratio:390/800;border-radius:44px;overflow:hidden;position:relative;display:flex;flex-direction:column;background:var(--bg);color:var(--fg);box-shadow:var(--shadow),0 0 0 9px #141415,0 0 0 10.5px #383A3B}
.pager{display:flex;gap:8px}
.pg{border:1px solid var(--line);border-radius:9px;padding:8px 14px;font-size:12.5px;font-weight:500;color:var(--ink-2)}
.pg:hover{border-color:var(--accent);color:var(--ink)}
.cap{font-family:var(--f-u);font-size:10.5px;font-weight:500;letter-spacing:.09em;text-transform:uppercase;color:var(--ink-3)}

.notes{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:24px 26px}
.n-eye{font-family:var(--f-u);font-size:9.5px;font-weight:600;letter-spacing:.14em;text-transform:uppercase;color:var(--ink-3);margin:0 0 8px}
.n-h{font-size:26px;font-weight:700;letter-spacing:-.03em;margin:0 0 6px;line-height:1.08}
.n-job{margin:0 0 20px;font-size:13.5px;line-height:1.6;color:var(--ink-2);max-width:58ch}
.note{border-top:1px solid var(--line);padding-top:15px;margin-top:15px}
.note:first-of-type{border-top:0;padding-top:0;margin-top:0}
.n-tag{display:inline-block;font-family:var(--f-u);font-size:9px;font-weight:600;letter-spacing:.11em;text-transform:uppercase;padding:4px 8px;border-radius:5px;margin-bottom:8px}
.t-fix{background:#F6EEDC;color:#6E4C12}
.t-keep{background:#E3EFEA;color:#245542}
.t-risk{background:#F9E7E5;color:#7E251D}
.t-ref{background:var(--pg-2);color:var(--ink-2);border:1px solid var(--line)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .t-fix{background:#2C2416;color:#E5BC72}
 :root:not([data-theme="light"]) .t-keep{background:#15291F;color:#7FCFA8}
 :root:not([data-theme="light"]) .t-risk{background:#2C1917;color:#F0968B}}
:root[data-theme="dark"] .t-fix{background:#2C2416;color:#E5BC72}
:root[data-theme="dark"] .t-keep{background:#15291F;color:#7FCFA8}
:root[data-theme="dark"] .t-risk{background:#2C1917;color:#F0968B}
.note p{margin:0;font-size:13.5px;line-height:1.62;color:var(--ink);max-width:60ch}
.note p b{font-weight:600}
.refs{margin-top:8px}
.refs a{display:inline-block;font-family:var(--f-u);font-size:10.5px;color:var(--ink-2);text-decoration:none;border:1px solid var(--line);border-radius:999px;padding:4px 10px;margin:0 5px 5px 0}
.refs a:hover{border-color:var(--accent);color:var(--accent)}

/* =====================================================
   APP — Direction B, refined
   ===================================================== */
.sc{flex:1;min-height:0;display:none;flex-direction:column}
.sc[data-on="1"]{display:flex}
.roll{flex:1;min-height:0;overflow-y:auto;overscroll-behavior:contain}
.roll::-webkit-scrollbar{width:0}

.sbar{flex-shrink:0;height:46px;display:flex;align-items:center;justify-content:space-between;padding:0 27px 0 31px;
  font-family:var(--f-u);font-size:12.5px;font-weight:500;letter-spacing:-.01em;color:var(--fg);position:relative;z-index:9}
.sb-r{display:flex;align-items:center;gap:5px}
.sb-b{display:flex;align-items:flex-end;gap:1.6px;height:9px}
.sb-b i{width:2.6px;background:currentColor;border-radius:1px;display:block}
.batt{width:21px;height:10.5px;border:1.3px solid currentColor;border-radius:3px;position:relative;opacity:.85}
.batt::after{content:"";position:absolute;inset:1.6px;right:5px;background:currentColor;border-radius:1px}

/* type roles */
.lab{font-family:var(--f-u);font-size:9.5px;font-weight:600;letter-spacing:.14em;text-transform:uppercase;color:var(--fg-3)}
.met{font-family:var(--f-u);font-size:11px;font-weight:400;color:var(--fg-3);font-feature-settings:"tnum" 1}
.h-xl{font-size:34px;font-weight:700;letter-spacing:-.04em;line-height:1.02;margin:0}
.h-l{font-size:27px;font-weight:700;letter-spacing:-.035em;line-height:1.06;margin:0}
.h-m{font-size:20px;font-weight:600;letter-spacing:-.028em;line-height:1.15;margin:0}
.bd{font-size:14.5px;line-height:1.55;color:var(--fg-2);margin:0}

/* header */
.hdr{flex-shrink:0;padding:2px 22px 16px;display:flex;align-items:flex-end;justify-content:space-between;gap:14px}
.hdr .sub{margin:8px 0 0;display:flex;align-items:center;gap:7px}
.live{width:6px;height:6px;border-radius:50%;background:var(--crit);flex-shrink:0;animation:p 2.6s infinite}
.live.calm{background:var(--ok);animation:none}
@keyframes p{0%{box-shadow:0 0 0 0 rgba(255,95,82,.55)}70%{box-shadow:0 0 0 8px rgba(255,95,82,0)}100%{box-shadow:0 0 0 0 rgba(255,95,82,0)}}
.circ{width:38px;height:38px;border-radius:50%;border:1px solid var(--hair-2);display:grid;place-items:center;color:var(--fg-2);flex-shrink:0;position:relative}
.circ:hover{border-color:var(--fg-3);color:var(--fg)}
.circ .pip{position:absolute;top:7px;right:7px;width:7px;height:7px;border-radius:50%;background:var(--crit);border:2px solid var(--bg)}
.segs{flex-shrink:0;display:flex;gap:24px;padding:0 22px;border-bottom:1px solid var(--hair)}
.seg{font-size:14px;font-weight:600;letter-spacing:-.015em;color:var(--fg-3);padding:0 0 12px;position:relative}
.seg[aria-selected="true"]{color:var(--fg)}
.seg[aria-selected="true"]::after{content:"";position:absolute;left:0;right:0;bottom:-1px;height:1.5px;background:var(--fg)}

/* hero */
.hero{margin:16px 16px 0;border-radius:20px;padding:20px 19px 18px;position:relative;overflow:hidden;text-align:left;width:calc(100% - 32px);display:block}
.hero::before{content:"";position:absolute;inset:0;background:linear-gradient(158deg,var(--hd) 0%,#0F0F11 70%);opacity:.9}
.hero>*{position:relative}
.hero .kick{display:flex;align-items:center;gap:8px;color:var(--hc);margin-bottom:13px}
.hero .kick i{width:6px;height:6px;border-radius:50%;background:currentColor;display:block}
.hero h3{font-size:29px;font-weight:700;letter-spacing:-.038em;line-height:1.03;margin:0;color:var(--fg);text-wrap:balance}
.hero p{font-size:13.5px;line-height:1.5;color:var(--fg-2);margin:11px 0 0;max-width:31ch}
.hero .row{display:flex;gap:7px;margin-top:16px;flex-wrap:wrap}
.chip{font-family:var(--f-u);font-size:10px;font-weight:500;letter-spacing:.05em;text-transform:uppercase;padding:5px 9px;border-radius:6px;
  background:rgba(255,255,255,.06);color:var(--fg-2);display:inline-flex;align-items:center;gap:5px;white-space:nowrap}
.chip.good{background:rgba(79,196,138,.13);color:#7DD6AA}
.chip.warn{background:rgba(233,161,59,.13);color:#EEBB74}

/* stream */
.strm{padding-top:4px}
.item{display:grid;grid-template-columns:58px minmax(0,1fr);gap:14px;padding:16px 22px;border-bottom:1px solid var(--hair);text-align:left;width:100%;align-items:start}
.item:hover{background:var(--surf)}
.dist{font-family:var(--f-u);font-size:15px;font-weight:500;color:var(--fg);letter-spacing:-.02em;font-feature-settings:"tnum" 1;line-height:1.15}
.dist span{display:block;font-size:9.5px;font-weight:500;letter-spacing:.1em;text-transform:uppercase;color:var(--fg-3);margin-top:4px}
.ibody{min-width:0}
.icat{font-family:var(--f-u);font-size:9.5px;font-weight:600;letter-spacing:.13em;text-transform:uppercase;color:var(--sc);display:flex;align-items:center;gap:7px;margin-bottom:6px}
.icat i{width:5px;height:5px;border-radius:50%;background:var(--sc);display:block;flex-shrink:0}
.it{font-size:16.5px;font-weight:600;letter-spacing:-.028em;line-height:1.2;margin:0 0 7px;color:var(--fg);text-wrap:balance}
.im{font-family:var(--f-u);font-size:11px;color:var(--fg-3);display:flex;align-items:center;gap:8px;flex-wrap:wrap;font-feature-settings:"tnum" 1}
.im .v{color:var(--ok);display:inline-flex;align-items:center;gap:4px}
.im .un{color:var(--fg-3);border:1px dashed var(--hair-2);padding:2px 7px;border-radius:5px}
.held{display:flex;gap:8px;align-items:flex-start;margin-top:9px;padding:9px 11px;border-radius:9px;background:var(--imp-d);color:#E8B975;font-size:11.5px;line-height:1.45}
.held svg{flex-shrink:0;margin-top:1px}

/* tabs */
.tabs{flex-shrink:0;border-top:1px solid var(--hair);display:grid;grid-template-columns:repeat(5,1fr);
  padding:10px 8px calc(10px + env(safe-area-inset-bottom,0px));align-items:center;background:var(--bg)}
.tab{display:flex;flex-direction:column;align-items:center;gap:5px;color:var(--fg-3);font-family:var(--f-u);font-size:9.5px;font-weight:500;letter-spacing:.02em}
.tab[aria-current="true"]{color:var(--fg)}
.fab{width:42px;height:42px;border-radius:14px;background:var(--fg);color:var(--bg);display:grid;place-items:center}

/* buttons */
.btn{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;border-radius:14px;padding:15px;font-size:15.5px;font-weight:600;letter-spacing:-.015em;background:var(--fg);color:var(--bg)}
.btn:hover{opacity:.9}
.btn.sec{background:transparent;color:var(--fg);border:1px solid var(--hair-2)}
.btn.sec:hover{border-color:var(--fg-3);opacity:1}
.btn.qui{background:transparent;color:var(--fg-3);font-weight:500}
.btn.qui:hover{color:var(--fg-2);opacity:1}
.btn:disabled{opacity:.4;cursor:not-allowed}
.stack{display:flex;flex-direction:column;gap:9px}

/* onboarding */
.ob{flex:1;display:flex;flex-direction:column;padding:0 24px calc(24px + env(safe-area-inset-bottom,0px))}
.ob-art{flex:1;min-height:0;display:grid;place-items:center;padding:10px 0}
.dots{display:flex;gap:6px;justify-content:center;padding:16px 0 14px}
.dots i{width:5px;height:5px;border-radius:50%;background:var(--hair-2);display:block}
.dots i.on{background:var(--fg);width:17px;border-radius:3px}
.pts{display:flex;flex-direction:column;gap:20px;margin:26px 0 0}
.pt{display:grid;grid-template-columns:22px 1fr;gap:14px;align-items:start}
.pt .pi{color:var(--fg-3);margin-top:2px}
.pt h4{margin:0 0 4px;font-size:15px;font-weight:600;letter-spacing:-.02em;color:var(--fg)}
.pt p{margin:0;font-size:13px;line-height:1.5;color:var(--fg-3)}

/* onboarding map hero */
.ob1{position:relative;flex:1;min-height:0;display:flex;flex-direction:column}
.ob1-map{position:absolute;top:0;left:0;right:0;height:57%;overflow:hidden;pointer-events:none}
.ob1-map .pin button{pointer-events:none}
.ob1-scrim{position:absolute;inset:0;background:linear-gradient(to bottom,rgba(9,9,10,.28) 0%,rgba(9,9,10,0) 30%,rgba(9,9,10,.55) 62%,rgba(9,9,10,.94) 84%,var(--bg) 100%)}
.ob1-c{margin-top:auto;position:relative;z-index:2;padding:0 24px calc(24px + env(safe-area-inset-bottom,0px))}

/* iOS permission */
.veil{position:absolute;inset:0;background:rgba(0,0,0,.62);display:grid;place-items:center;padding:30px;z-index:20}
.perm{background:#1C1C1E;border-radius:15px;width:100%;max-width:270px;overflow:hidden;text-align:center;box-shadow:0 26px 54px -12px rgba(0,0,0,.6)}
.perm-b{padding:19px 18px 0}
.perm h5{margin:0 0 6px;font-size:16px;font-weight:600;color:#fff;letter-spacing:-.02em}
.perm p{margin:0 0 14px;font-size:12.5px;line-height:1.42;color:#98989E;font-family:var(--f-u)}
.perm-map{height:78px;margin:0 -18px;position:relative;overflow:hidden;background:#2A2A2D}
.perm-o{border-top:.5px solid #38383A}
.perm-o button{display:block;width:100%;padding:12px;font-size:15px;color:#4FA8F7;border-bottom:.5px solid #38383A;font-family:var(--f-u)}
.perm-o button:last-child{border-bottom:0}
.perm-o button.b{font-weight:600}
.perm-o button:hover{background:rgba(255,255,255,.05)}

/* detail */
.d-hero{padding:14px 22px 20px}
.d-kick{display:flex;align-items:center;gap:9px;margin-bottom:14px;flex-wrap:wrap}
.d-cat{font-family:var(--f-u);font-size:9.5px;font-weight:600;letter-spacing:.13em;text-transform:uppercase;color:var(--sc);display:flex;align-items:center;gap:7px}
.d-cat i{width:5px;height:5px;border-radius:50%;background:var(--sc);display:block}
.d-meta{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-top:12px}
.blk{padding:20px 22px;border-top:1px solid var(--hair)}
.blk-h{margin:0 0 14px}
.ask{background:var(--surf);border-radius:16px;padding:16px}
.ask h4{margin:0 0 6px;font-size:16px;font-weight:600;letter-spacing:-.025em;color:var(--fg)}
.ask p{margin:0 0 14px;font-size:12.5px;line-height:1.5;color:var(--fg-3)}
.askrow{display:grid;grid-template-columns:1fr 1fr 1fr;gap:7px}
.askb{border:1px solid var(--hair-2);border-radius:11px;padding:11px 4px;font-size:12.5px;font-weight:600;letter-spacing:-.01em;color:var(--fg)}
.askb:hover{border-color:var(--fg-3)}
.askb.on{background:var(--fg);border-color:var(--fg);color:var(--bg)}
.done{display:flex;align-items:center;gap:10px;font-size:14px;color:var(--ok);font-weight:500}
.tl{display:flex;flex-direction:column}
.tl-i{display:grid;grid-template-columns:14px 1fr;gap:13px;padding-bottom:18px;position:relative}
.tl-i:last-child{padding-bottom:0}
.tl-i::before{content:"";position:absolute;left:6.5px;top:14px;bottom:0;width:1px;background:var(--hair-2)}
.tl-i:last-child::before{display:none}
.tl-d{width:7px;height:7px;border-radius:50%;background:var(--hair-2);margin:5px 0 0 3.5px;z-index:1}
.tl-d.hl{background:var(--ok)}
.tl p{margin:0;font-size:14px;line-height:1.5;color:var(--fg)}
.tl .met{margin-top:5px;display:block}
.actb{flex-shrink:0;border-top:1px solid var(--hair);padding:12px 16px calc(12px + env(safe-area-inset-bottom,0px));display:grid;grid-template-columns:1fr 1fr;gap:9px}
.mini{display:flex;align-items:center;justify-content:center;gap:8px;padding:13px;border-radius:12px;font-size:13.5px;font-weight:600;color:var(--fg-2);border:1px solid var(--hair-2)}
.mini:hover{color:var(--fg);border-color:var(--fg-3)}

/* create */
.cats{display:grid;grid-template-columns:1fr 1fr;gap:8px;padding:4px 16px 20px}
.cat{display:flex;align-items:center;gap:12px;background:var(--surf);border-radius:15px;padding:15px 14px;text-align:left}
.cat:hover{background:var(--surf-2)}
.cat .ci{color:var(--sc);flex-shrink:0}

  pins.map(p=>'<span class="pin'+(p.f?' faint':'')+'" style="left:'+p.x+'%;top:'+p.y+'%;--pc:'+p.c+'"><button tabindex="-1">'+I.pin+p.l+'</button></span>').join('')+
  '<span class="ob1-scrim"></span></div>'+
  sbar()+
  '<div class="ob1-c">'+
   '<span class="lab" style="display:block;margin-bottom:14px">Ikeja GRA · right now</span>'+
   '<h2 class="h-xl" style="font-size:33px">Important things happening nearby. In time to matter.</h2>'+
   '<p class="bd" style="margin-top:14px;max-width:32ch">The blocked road, the outage, the incident at the gate — while it still changes what you would do.</p>'+
   '<div class="dots"><i class="on"></i><i></i><i></i></div>'+
   '<div class="stack"><button class="btn" data-go="ob2">Get started</button></div>'+
  '</div></div>';
},

ob2(){
 return sbar()+'<div class="ob"><div style="flex:1;min-height:0;display:flex;flex-direction:column;justify-content:center;padding:16px 0">'+
 '<h2 class="h-xl" style="font-size:30px">Where should we keep you informed?</h2>'+
 '<p class="bd" style="margin-top:12px">You can change this any time, and add as many places as you like.</p>'+
 '<div class="pts">'+
  '<div class="pt"><span class="pi">'+I.pin+'</span><div><h4>Wherever I am</h4><p>We use your rough area — about 500 m — never your exact street.</p></div></div>'+
  '<div class="pt"><span class="pi">'+I.home+'</span><div><h4>A place I choose</h4><p>Home, work, your child’s school. Watched even when you are not there.</p></div></div>'+
  '<div class="pt"><span class="pi">'+I.security+'</span><div><h4>Nobody sees where you are</h4><p>Your location is only ever used to decide what to show you.</p></div></div>'+
 '</div></div>'+
 '<div class="dots"><i></i><i class="on"></i><i></i></div>'+
 '<div class="stack"><button class="btn" data-go="ob3">Use where I am</button>'+
 '<button class="btn sec">Choose a place instead</button>'+
 '<button class="btn qui" data-tab="home">Skip for now</button></div></div>';
},

ob3(){
 return sbar()+'<div class="ob" style="opacity:.35;pointer-events:none">'+
 '<div style="flex:1;min-height:0;display:flex;flex-direction:column;justify-content:center">'+
 '<h2 class="h-xl" style="font-size:30px">Where should we keep you informed?</h2>'+
 '<p class="bd" style="margin-top:12px">You can change this any time.</p></div>'+
 '<div class="stack"><span class="btn">Use where I am</span></div></div>'+
 '<div class="veil"><div class="perm"><div class="perm-b">'+
  '<h5>Allow “Community Alerts” to use your location?</h5>'+
  '<p>Your approximate location is used to show alerts near you. It is never shared with other people.</p>'+
  '<div class="perm-map">'+permMap()+'</div></div>'+
  '<div class="perm-o"><button class="b" data-go="home">Allow While Using App</button>'+
  '<button data-go="home">Allow Once</button><button data-go="empty">Don’t Allow</button></div>'+
 '</div></div>';
}};

const NOTES={
ob1:{t:'Value first',job:'Say what the product is for before asking for anything. This screen has to earn the permission prompt two screens later.',
 n:[['keep','Positioning','Leads on <b>“in time to matter”</b>, not on danger. §47 asks for calm and useful; an app that opens with sirens teaches people to dread opening it.'],
    ['fix','Three examples, not a feature list','Naming the blocked road, the outage and the gate incident lets people recognise their own week in it.'],
    ['ref','Pattern','Viator primes location with a reason before the OS dialog. GO Club asks with no reason at all, and it reads as a demand.','https://mobbin.com/flows/247308cf-b335-49b7-9644-bb99eabc7217|Viator priming']]},
ob2:{t:'Where to watch',job:'Turn the four location modes of §8 into one question a person can answer.',
 n:[['fix','Four modes, two choices','Showing all four on first run is a quiz. <b>Current</b> and <b>pinned</b> cover the first session; followed and temporary places belong in Places, once there is a reason to want them.'],
    ['keep','The privacy promise sits on the screen that asks','“About 500 m, never your exact street” is next to the button that turns it on, not buried in a policy.'],
    ['keep','Skip is a real path','It lands on the quiet-area screen, so a refusal is still a working app.']]},
ob3:{t:'The permission moment',job:'The one screen you cannot design. Everything before it is the design.',
 n:[['keep','Ask after the reason','By now the person has read what it is for and chosen it. That ordering is the whole trick.'],
    ['risk','“Don’t Allow” goes somewhere useful','Roughly a third will decline. Tapping it here lands on the quiet area with pinned places offered — not a nag screen.']]},
home:{t:'Home',job:'Answer one question in the first screenful: is anything happening around me that I should know about?',
 n:[['fix','One alert is promoted, the rest are a stream','The hero is chosen by distance and confidence together. Everything else gets a tight row where <b>distance is the left margin</b> and severity is a colour tick — no card chrome, no counts, no hearts.'],
    ['risk','The unverified critical alert is the riskiest thing in the product','A single-source security report is what gets weaponised (§24). It is severe in colour but <b>quiet in status</b>, and it says outright that it has not been sent to anyone.'],
    ['fix','Confidence gates delivery','§22 tiers notifications by category, which still lets one anonymous person ring 180 phones. An unconfirmed critical report goes to the feed and waits.'],
    ['fix','No engagement furniture','No view counts, no reactions, no infinite scroll. Citizen’s feed leads with video and nationwide news; that is the drift §37 warns about.'],
    ['ref','Pattern','Finimize and HYPE for the promoted-hero-then-stream shape; Ultrahuman for the metadata-led row.','https://mobbin.com/screens/5089f476-5308-4b7b-8109-5dcd49fde77e|Finimize']]},
detail:{t:'Alert detail',job:'The trust screen. Everything here helps someone decide whether to act.',
 n:[['fix','Two questions, asked at different times','§17 offers “Confirm / Not accurate”; §19 asks “Is this still happening?”. Those measure <b>accuracy</b> and <b>liveness</b>, and mixing them corrupts the confidence score and the lifecycle. Open the flooding alert for the aged version.'],
    ['keep','Timeline instead of comments','§32 is right to hold comments back. The timeline gives what comments are actually used for — what changed — without the arguing.'],
    ['fix','Say why the answer matters','Without that line, a confirm button is just another like.'],
    ['risk','The pin is snapped to the junction','§26 protects pinned places, but proposing the reporter’s live position as the alert location publishes where they stood. For security categories that can identify them.']]},
map:{t:'Map',job:'Geographic overview. Useful, and deliberately not the front door.',
 n:[['keep','Feed first, map second','§27 says the map should not become the product. A map asks you to interpret; a list tells you.'],
    ['fix','Confidence shows on the pin','The unconfirmed security pin is a dashed outline, not a solid chip. A map where every pin looks equally true is a misinformation surface.'],
    ['keep','Your alert radius is drawn','Makes “who gets told about things here” legible without a settings screen.']]},
cat:{t:'What happened',job:'Step one of reporting. It has to survive one hand, in the rain, while upset.',
 n:[['fix','Five steps became two','§11–15 specify category → location → description → audience → confirm. Location is known, audience is derivable, and confirmation belongs beside the send button. <b>Category, then one review screen.</b>'],
    ['keep','Structured categories','Free text costs time and makes routing impossible.'],
    ['ref','Pattern','Apple Maps reports an incident in three taps with no text at all. Speed is the feature.','https://mobbin.com/flows/b2ae1786-5fc7-44e2-a9b7-47c599e0b6fd|Apple Maps']]},
review:{t:'Review and send',job:'Four PRD steps on one screen, with the consequence next to the button that causes it.',
 n:[['fix','Audience is a consequence, not a control','§14 asks the reporter to set a radius. Nobody reporting a fire thinks in kilometres, and the category already implies the answer. Shown as a number, with Adjust for the few who need it — the biggest speed win in the flow.'],
    ['fix','Direction for road incidents','§21 names the problem — a circle is wrong for a blocked road — then defers it. A direction chip is a cheap partial fix with no routing engine.'],
    ['keep','Confirmation merged into the send bar','Same protection as §15’s confirm step, one screen fewer.'],
    ['ref','Pattern','Citizen puts “2434 nearby users will be notified” under Send. Consequence stated, not delegated.','https://mobbin.com/flows/f5a8ff74-f330-42da-9c4e-2727f53b52d1|Citizen create']]},
sent:{t:'Sent',job:'Close the loop, and teach the trust model at the only moment anyone is paying attention to it.',
 n:[['fix','Tell them what did not happen','For a critical category this says plainly that <b>no notification has gone out</b>, and why. It also quietly discourages the person filing a false alarm.'],
    ['fix','Resolution is scheduled here','§34 lets the creator resolve an alert but gives them no reason to return. The promised check-in is what keeps the feed clean.'],
    ['keep','No score, no badge','§23 warns against a popularity contest. Nothing rewards reporting volume.']]},
places:{t:'Places',job:'Make the four location modes manageable, and the privacy claims of §25 and §26 visible.',
 n:[['keep','Current, pinned and followed are separate groups','Three groups, three meanings.'],
    ['fix','Each place carries its own notification level','§29 asks for per-place radius, categories and preference. Shown as one summary line; the detail is a level deeper.'],
    ['risk','State the guarantee where it is doubted','“Other people cannot tell that anyone has pinned a given house” is the §26 requirement, written where someone decides whether to pin their home.']]},
notif:{t:'Notifications',job:'The screen that decides whether this survives contact with real users. §50 names fatigue as risk one.',
 n:[['fix','A floor and a ceiling','Full control lets someone mute the fire alert and then blame the app; no control produces fatigue. <b>Critical cannot be switched off, and is capped at four a day.</b> Everything else is yours.'],
    ['fix','Batching stated on the row','“At most one an hour” is a promise you can be held to, and it is what stops forty outage reports making forty buzzes.'],
    ['risk','Never paywall this screen','Citizen gates alert customisation behind a subscription, so the free experience is the noisy one. For a product whose main risk is fatigue, that is backwards.'],
    ['ref','Pattern','YouTube Studio ships a row with no toggle at all — the precedent for an always-on tier.','https://mobbin.com/screens/1a75c9de-4f7f-4d1d-8fb5-468adf1b3405|YouTube Studio']]},
lock:{t:'Lock screen',job:'The real product surface. Most alerts are read and acted on here and never opened.',
 n:[['fix','§49 lists it and the PRD never designs it','If the notification does not carry enough to act on, the product has failed however good the feed is.'],
    ['fix','Trust rides along','“14 people nearby confirmed” is in the notification body. Without it, the whole §18 system is invisible to the people who most need it.'],
    ['keep','Distance and direction in the first line','The two facts that change what someone does next.']]},
empty:{t:'Quiet area',job:'The most likely first experience in a new community, and the one §42 leaves undesigned.',
 n:[['risk','Cold start is a design problem first','The first person in an estate opens the app to nothing, and an empty list reads as broken.'],
    ['fix','Show coverage, not content','“47 people watching” proves the app works <i>and</i> the area is calm — two different things an empty list cannot separate.'],
    ['keep','Quiet is the good outcome','The copy says so rather than apologising for having nothing.'],
    ['fix','The two exits are the two fixes','Inviting neighbours raises density; following another place gives the app something to show tonight. Both work on §43.']]}
};

const ORDER=['ob1','ob2','ob3','home','detail','map','cat','review','sent','places','notif','lock','empty'];
const NUM={};ORDER.forEach((k,i)=>NUM[k]=String(i+1).padStart(2,'0'));
const CAP={ob1:'Value',ob2:'Where to watch',ob3:'Permission',home:'Home',detail:'Alert detail',map:'Map',cat:'What happened',review:'Review',sent:'Sent',places:'Places',notif:'Notifications',lock:'Lock screen',empty:'Quiet area'};
const phone=document.getElementById('phone');

function render(){
 phone.innerHTML='<div class="sc" data-on="1">'+B[S.screen]()+'</div>';
 document.querySelectorAll('.nav-b').forEach(b=>b.setAttribute('aria-current',String(b.dataset.go===S.screen)));
 document.getElementById('cap').textContent=NUM[S.screen]+' — '+CAP[S.screen];
 const n=NOTES[S.screen];
 document.getElementById('n-eye').textContent='Screen '+NUM[S.screen]+' · audit';
 document.getElementById('n-title').textContent=n.t;
 document.getElementById('n-job').textContent=n.job;
 document.getElementById('n-notes').innerHTML=n.n.map(x=>{
  const c={fix:'t-fix',keep:'t-keep',risk:'t-risk',ref:'t-ref'}[x[0]];
  const l={fix:'Changed',keep:'Kept',risk:'Risk',ref:'Reference'}[x[0]];
  let b='<p>'+x[2]+'</p>';
  if(x[0]==='ref'&&x[3]){const[h,t]=x[3].split('|');b+='<div class="refs"><a href="'+h+'" target="_blank" rel="noopener">'+t+' ↗</a></div>';}
  return '<div class="note"><span class="n-tag '+c+'">'+l+' · '+x[1]+'</span>'+b+'</div>';
 }).join('');
 wire();
}
function go(s){S.screen=s;render();}
function toast(m){const t=document.createElement('div');t.className='toast';
 t.innerHTML='<span style="color:var(--ok)">'+I.check+'</span><span>'+m+'</span>';
 phone.querySelector('.sc').appendChild(t);setTimeout(()=>t.remove(),2200);}

function wire(){
 phone.querySelectorAll('[data-tab]').forEach(b=>b.onclick=()=>{const t=b.dataset.tab;go(t==='you'?'notif':t);});
 phone.querySelectorAll('[data-go]').forEach(b=>b.onclick=()=>go(b.dataset.go));
 phone.querySelectorAll('[data-open]').forEach(b=>b.onclick=e=>{e.stopPropagation();S.open=b.dataset.open;
   if(S.screen==='map')render();else go('detail');});
 phone.querySelectorAll('[data-cat]').forEach(b=>b.onclick=()=>{S.cat=b.dataset.cat;go('review');});
 phone.querySelectorAll('[data-ans]').forEach(b=>b.onclick=()=>{
  const[id,v]=b.dataset.ans.split('|');const a=alerts.find(x=>x.id===id);
  b.classList.add('on');
  setTimeout(()=>{S.ans[id]=v;
   if(v==='yes'){S.cnt[id]++;if(a.trust==='un'){a.trust='multi';a.held=false;}}
   if(v==='over'){a.sev='resolved';a.trust='ok';}
   render();toast(v==='over'?'Marked as over. Others nearby will be asked too.':'Counted. This alert is stronger now.');},220);
 });
 phone.querySelectorAll('[data-sw]').forEach(b=>b.onclick=()=>{
  const s=b.classList.contains('sw')?b:b.querySelector('.sw');if(s)s.classList.toggle('on');});
 const ta=phone.querySelector('#ta');
 if(ta)ta.oninput=()=>{phone.querySelector('#cc').textContent=ta.value.length+' / 280';};
 const adj=phone.querySelector('#adjb');
 if(adj)adj.onclick=()=>{const bx=phone.querySelector('#adjbox');
  const closed=bx.classList.toggle('hide');adj.textContent=closed?'Adjust':'Done';};
 const ch=phone.querySelector('#chips');
 if(ch){const c=CATS.find(x=>x.k===S.cat);const m=[.35,1,1.9,3.4];
  ch.querySelectorAll('.pick').forEach(p=>p.onclick=()=>{
   ch.querySelectorAll('.pick').forEach(o=>o.classList.remove('on'));p.classList.add('on');
   const v=Math.round(c.p*m[+p.dataset.r]/10)*10;
   phone.querySelector('#rn').innerHTML='~'+v+'<span>people</span>';
   phone.querySelector('#sn').textContent='Reaches about '+v+' people around Ikeja GRA';
   if(+p.dataset.r!==1)phone.querySelector('#rw').innerHTML='Changed from the suggested <b>'+c.r+'</b>. Wider is not always better — it costs you trust with people it did not concern.';
  });}
 const dir=phone.querySelector('#dir');
 if(dir)dir.querySelectorAll('.pick').forEach(p=>p.onclick=()=>{
  dir.querySelectorAll('.pick').forEach(o=>o.classList.remove('on'));p.classList.add('on');});
 const sd=phone.querySelector('#send');
 if(sd)sd.onclick=()=>{sd.textContent='Sending…';sd.disabled=true;setTimeout(()=>go('sent'),500);};
}
document.querySelectorAll('.nav-b').forEach(b=>b.onclick=()=>go(b.dataset.go));
document.getElementById('next').onclick=()=>go(ORDER[(ORDER.indexOf(S.screen)+1)%ORDER.length]);
document.getElementById('prev').onclick=()=>go(ORDER[(ORDER.indexOf(S.screen)-1+ORDER.length)%ORDER.length]);
document.addEventListener('keydown',e=>{if(e.target.matches('textarea,input'))return;
 if(e.key==='ArrowRight')document.getElementById('next').click();
 if(e.key==='ArrowLeft')document.getElementById('prev').click();});
render();
</script>
